name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.47 }
      - run: |
          mkdir build
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web \
            -DCMAKE_EXE_LINKER_FLAGS="-s USE_GLFW=3 -s ASYNCIFY -s TOTAL_MEMORY=33554432 --shell-file ${GITHUB_WORKSPACE}/shell.html -s GL_ENABLE_GET_PROC_ADDRESS=1"
          emmake make -C build -j$(nproc)
          mkdir deploy
          cp build/EchoRunner.html deploy/index.html
          cp build/EchoRunner.js   deploy/
          cp build/EchoRunner.wasm deploy/
      - uses: actions/upload-pages-artifact@v3
        with: { path: deploy }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/deploy-pages@v4
        id: d
